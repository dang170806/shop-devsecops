name: CI Package Release Artifact
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Verify and package application
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RISK_SCORE_THRESHOLD: '10'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Make maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify and package
        id: tests
        run: ./mvnw verify -B
        env:
          GOOGLE_CLIENT_ID: ci-test-client
          GOOGLE_CLIENT_SECRET: ci-test-secret
          GITHUB_CLIENT_ID: ci-test-client
          GITHUB_CLIENT_SECRET: ci-test-secret
      - name: Build image for scanning
        id: image_build
        run: docker build -t local/shopping-cart:${{ github.sha }} .
      - name: Scan image with trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/shopping-cart:${{ github.sha }}
          format: json
          output: trivy-result.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
      - name: Calculate risk and generate summary
        if: always()
        run: bash .github/scripts/calculate_risk.sh
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          IMAGE_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
      - name: Enforce security gate
        if: always()
        run: bash .github/scripts/enforce_security_gate.sh
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          IMAGE_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
      - name: Upload application JAR
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: shopping-cart-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
