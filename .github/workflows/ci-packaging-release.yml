name: CI Package Release Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      RISK_SCORE_THRESHOLD: '10'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Verify and package
        id: tests
        run: ./mvnw clean verify -B
        env:
          GOOGLE_CLIENT_ID: ci-test-client
          GOOGLE_CLIENT_SECRET: ci-test-secret
          GITHUB_CLIENT_ID: ci-test-client
          GITHUB_CLIENT_SECRET: ci-test-secret

      - name: Build image for scanning
        id: image_build
        run: docker build --tag local/shopping-cart:${{ github.sha }} .

      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/shopping-cart:${{ github.sha }}
          format: json
          output: trivy-result.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trivy-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Calculate risk and write summary
        if: always()
        run: bash .github/scripts/calculate_risk.sh
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          IMAGE_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}

      - name: Enforce security gate
        if: always()
        run: bash .github/scripts/enforce_security_gate.sh
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          IMAGE_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}

      - name: Upload verified application JAR
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: shoe-shopping-cart-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/app.jar
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LOCAL_IMAGE: local/shopping-cart:${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPO,,}"
          docker tag "$LOCAL_IMAGE" "$IMAGE:$GITHUB_REF_NAME"
          docker tag "$LOCAL_IMAGE" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"