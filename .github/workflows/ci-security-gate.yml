name: CI Security Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Security & Quality check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RISK_SCORE_THRESHOLD: '10'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run unit and integration tests
        id: tests
        run: ./mvnw clean verify -B
        env:
          GOOGLE_CLIENT_ID: ci-test-client
          GOOGLE_CLIENT_SECRET: ci-test-secret
          GITHUB_CLIENT_ID: ci-test-client
          GITHUB_CLIENT_SECRET: ci-test-secret

      - name: Build image for scanning
        id: image_build
        run: docker build --tag local/shopping-cart:${{ github.sha }} .

      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/shopping-cart:${{ github.sha }}
          format: json
          output: trivy-result.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trivy-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Calculate risk and write summary
        if: always()
        run: bash .github/scripts/calculate_risk.sh
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          IMAGE_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}

      - name: Enforce security gate
        if: always()
        run: bash .github/scripts/enforce_security_gate.sh
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          IMAGE_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
