image:
  repository: ghcr.io/dang170806/shop-devsecops
  tag: v0.0.4
  pullPolicy: IfNotPresent

secretName: shop-secrets

app:
  replicas: 1
  port: 9095
  secretEnv:         
    - DB_USER
    - DB_PASSWORD
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 768Mi

mysql:
  image: mysql:8.4.8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
  database: db   
  storage: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi