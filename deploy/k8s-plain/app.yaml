apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - name: http
      port: 9095
      targetPort: 9095
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: shop
          image: ghcr.io/dang170806/shop-devsecops:v0.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9095
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/db
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: shop-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shop-secrets, key: DB_PASSWORD }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: shop-secrets, key: GOOGLE_CLIENT_ID }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: shop-secrets, key: GOOGLE_CLIENT_SECRET }
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: shop-secrets, key: GITHUB_CLIENT_ID }
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: shop-secrets, key: GITHUB_CLIENT_SECRET }
          startupProbe:
            tcpSocket:
              port: 9095
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 9095
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi